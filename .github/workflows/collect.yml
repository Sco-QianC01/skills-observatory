name: Collect public sources
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: public-source-collection
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - name: Collect RSS, YouTube and repository updates
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          X_BEARER_TOKEN: ${{ secrets.X_BEARER_TOKEN }}
        run: npm run collect
      - name: Save source index
        if: always()
        run: |
          if [ -z "$(git status --porcelain public/data/feed.json)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/feed.json
          git commit -m "data: refresh public source index"
          git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          git push
